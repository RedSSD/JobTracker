services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - .:/tracker
    ports:
      - "8000"
    env_file:
      - .env
    depends_on:
      - redis
      - db
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    restart: always

  db:
    image: postgres:latest
    networks:
      default:
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always


  redis:
    image: redis:alpine
    networks:
      default:
        aliases:
          - redis
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    restart: always

networks:
  default:
    driver: bridge

volumes:
  pgdata:
  redisdata: